name: Fetch Publications & News

on:
  schedule:
    - cron: '0 6 * * 1' # every Monday at 06:00 UTC
  workflow_dispatch: # allow manual trigger

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check publication import rules
        run: node --test scripts/test-publication-import.mjs

      - name: Fetch verified journal papers from Europe PMC
        run: node scripts/fetch-publications.mjs

      - name: Fetch news (releases, publications, manual)
        run: node scripts/fetch-news.mjs

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/publications.json src/data/news.json src/data/.publications-prev.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update publications and news feed"
            git push
          fi
